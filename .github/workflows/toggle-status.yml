name: Toggle Status

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Pilih status'
        required: true
        type: choice
        options:
          - ACTIVE
          - DISABLED

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update status file
        run: echo -n "${{ github.event.inputs.status }}" > status.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.txt
          git commit -m "Update status to ${{ github.event.inputs.status }}" || echo "No changes"
          git push

      - name: Confirm result
        run: |
          echo "## ✅ Status Berhasil Diupdate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status yang dipilih:** \`${{ github.event.inputs.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Isi file status.txt sekarang:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat status.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
